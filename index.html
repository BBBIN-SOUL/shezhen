<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>答题刷题应用</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 640px;
            padding: 30px;
            transition: all 0.3s;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            font-size: 0.95rem;
            color: #555;
            flex-wrap: wrap;
            gap: 10px;
        }
        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #4CAF50;
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-card {
            margin-bottom: 25px;
        }
        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 12px 15px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            color: #333;
        }
        .option:hover {
            background: #e9ecef;
            border-color: #adb5bd;
        }
        .option.selected {
            background: #e3f2fd;
            border-color: #2196F3;
            color: #0b5ed7;
        }
        .option.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        .option.wrong {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }
        /* 填空题输入框 */
        .fill-container {
            margin-top: 10px;
        }
        .fill-input {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            color: #333;
            background: #f8f9fa;
            transition: all 0.2s;
            outline: none;
            box-sizing: border-box;
        }
        .fill-input:focus {
            border-color: #2196F3;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
        }
        .fill-input:disabled {
            background: #f0f0f0;
            color: #888;
            cursor: not-allowed;
        }
        .fill-input.correct {
            border-color: #28a745;
            background: #d4edda;
        }
        .fill-input.wrong {
            border-color: #dc3545;
            background: #f8d7da;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .btn-primary {
            background: #2196F3;
            color: white;
        }
        .btn-primary:hover {
            background: #0b7ad1;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover {
            background: #1e8e37;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-danger:hover {
            background: #b02a37;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background: #545b62;
        }
        .result-message {
            text-align: center;
            font-size: 1.1rem;
            margin: 15px 0;
            min-height: 1.5em;
            font-weight: 600;
        }
        .explanation-box {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            font-size: 0.95rem;
            color: #856404;
            line-height: 1.6;
        }
        .explanation-box .correct-answer {
            font-weight: bold;
            color: #155724;
            margin-bottom: 8px;
        }

        /* 自定义弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-box {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            padding: 24px;
            animation: modalFadeIn 0.2s ease;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to   { opacity: 1; transform: scale(1); }
        }
        .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 12px;
        }
        .modal-message {
            font-size: 1rem;
            color: #444;
            line-height: 1.6;
            white-space: pre-line;   /* 支持 \n 换行 */
            word-break: break-word;
            margin-bottom: 20px;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* 登录状态栏 */
        .auth-status-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #555;
            flex-wrap: wrap;
        }
        .auth-status-bar .user-email {
            color: #2196F3;
            font-weight: 600;
        }

        .hidden {
            display: none;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #888;
            font-size: 0.85rem;
        }
        .category-buttons, .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0;
        }
        .category-buttons button, .mode-buttons button {
            padding: 15px;
            font-size: 1.1rem;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            color: #333 !important;
        }
        .category-buttons button:hover, .mode-buttons button:hover {
            background: #e0e0e0;
            border-color: #2196F3;
        }

        /* 历史记录样式 */
        .history-list {
            max-height: 70vh;
            overflow-y: auto;
            margin: 20px 0;
            text-align: left;
        }
        .history-date-group {
            margin-bottom: 20px;
        }
        .history-date-group h3 {
            color: #2c3e50;
            font-size: 1.1rem;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .history-date-group h3 .daily-summary {
            font-size: 0.85rem;
            font-weight: normal;
            color: #666;
            background: #f0f7ff;
            border: 1px solid #d0e3ff;
            border-radius: 6px;
            padding: 3px 8px;
        }
        .history-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #333;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 5px;
        }
        .history-item .score {
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 答题刷题 </h1></br>

        <!-- 科目选择屏 -->
        <div id="category-screen">
            <h2>选择科目</h2>
            <div class="category-buttons" id="category-buttons"></div>
            <div class="auth-status-bar" id="auth-status-bar">
                <span>未登录，历史记录和错题仅保存在本机</span>
                <button class="btn-secondary" id="auth-toggle-btn" onclick="openAuthModal()" style="padding:6px 14px;font-size:0.9rem;">👤 登录</button>
            </div>
            <div class="btn-group">
                <button class="btn-secondary" onclick="document.getElementById('file-input').click()">📂 导入题库</button>
                <button class="btn-secondary" onclick="showHistoryScreen()">📜 历史记录</button>
                <input type="file" id="file-input" accept=".json" style="display:none" onchange="importQuestions(event)">
            </div>
        </div>

        <!-- 模式选择屏 -->
        <div id="mode-screen" class="hidden">
            <h2>选择练习模式</h2>
            <div class="mode-buttons">
                <button class="btn-primary" onclick="startQuiz(30, 600)">10分钟30题</button>
                <button class="btn-primary" onclick="startQuiz(50, 1200)">20分钟50题</button>
                <button class="btn-primary" onclick="startQuiz(100, 2400)">40分钟100题</button>
                <button class="btn-danger" onclick="startReviewQuiz()">错题回顾（<span id="wrong-count-badge">0</span>）</button>
            </div>
            <div class="btn-group">
                <button class="btn-secondary" onclick="showCategoryScreen()">返回</button>
            </div>
        </div>

        <!-- 历史记录屏 -->
        <div id="history-screen" class="hidden">
            <h2>历史答题记录</h2>
            <div id="history-list" class="history-list"></div>
            <div class="btn-group">
                <button class="btn-secondary" onclick="showCategoryScreen()">返回</button>
                <button class="btn-secondary" onclick="renderHistory()">刷新</button>
            </div>
        </div>

        <!-- 答题屏 -->
        <div id="quiz-screen" class="hidden">
            <div class="stats">
                <span>📚 科目：<span id="current-category-display">-</span></span>
                <span>📌 进度：<span id="current-question">1</span>/<span id="total-questions">0</span></span>
                <span>✅ 得分：<span id="score">0</span></span>
                <span>⏱️ 剩余时间：<span id="time-left">--:--</span></span>
            </div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            
            <div class="question-card">
                <div class="question-text" id="question-text">加载中...</div>
                <div class="options" id="options-container"></div>
            </div>
            
            <div class="result-message" id="result-message"></div>
            <div id="explanation-box" class="explanation-box hidden"></div>
            
            <div class="btn-group">
                <button class="btn-primary" id="btn-submit" onclick="submitAnswer()">提交答案</button>
                <button class="btn-success hidden" id="btn-next" onclick="nextQuestion()">下一题 ➡️</button>
                <button class="btn-secondary" onclick="showMainMenu()">🏠 主菜单</button>
            </div>
        </div>

        <div class="footer">
            💾 进度自动保存在本地浏览器中
        </div>
    </div>

    <!-- 自定义弹窗 -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-title" id="modal-title">提示</div>
            <div class="modal-message" id="modal-message"></div>
            <div class="modal-buttons">
                <button class="btn-secondary hidden" id="modal-cancel">取消</button>
                <button class="btn-primary" id="modal-ok">确定</button>
            </div>
        </div>
    </div>

    <!-- 登录/注册弹窗 -->
    <div id="auth-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-title" id="auth-title">登录</div>
            <div style="margin-bottom:16px;">
                <input type="email" id="auth-email" class="fill-input" placeholder="邮箱" autocomplete="email" style="margin-bottom:10px;">
                <input type="password" id="auth-password" class="fill-input" placeholder="密码（至少6位）" autocomplete="current-password">
            </div>
            <div id="auth-error" style="color:#dc3545;font-size:0.9rem;margin-bottom:10px;min-height:1.2em;white-space:pre-line;"></div>
            <div class="modal-buttons" style="justify-content:space-between;flex-wrap:wrap;">
                <button class="btn-secondary" id="auth-switch-btn" onclick="switchAuthMode()">没有账号？去注册</button>
                <div style="display:flex;gap:8px;">
                    <button class="btn-secondary" onclick="closeAuthModal()">取消</button>
                    <button class="btn-primary" id="auth-submit-btn" onclick="submitAuth()">登录</button>
                </div>
            </div>
        </div>
    </div>

    <script>

        let questions = [];

        // ==================== 状态管理 ====================
        let currentIndex = 0;
        let score = 0;
        let selectedOption = null;
        let answered = false;
        let fillAnswer = '';   // 新增：填空题用户输入内容
        let answeredCount = 0;   // 新增：本次答题实际作答的题数
        let currentScreen = 'category';
        let currentCategory = '';
        let currentMode = { count: 0, seconds: 0 };
        let isReviewMode = false;   // 新增：是否处于错题回顾模式
        let quizQuestions = [];
        let timerInterval = null;
        let timeLeft = 0;

        const STORAGE_KEY = 'quiz_progress_data';
        const CUSTOM_QUESTIONS_KEY = 'custom_quiz_questions';
        const HISTORY_KEY = 'quiz_history_data';
        const WRONG_QUESTIONS_KEY = 'quiz_wrong_questions';   // 新增

        // ==================== Supabase 配置 ====================
        // ⚠️ 替换为你自己的值（从 Supabase 项目设置里复制）
        const SUPABASE_URL = 'https://wcgdkxtjdwwzmomhjbdp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Eb3qwwSHATCnLF0E-Hbgag_MNiIkHPY';

        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;      // 当前登录用户
        let authMode = 'login';      // 'login' | 'register'

        // ==================== 音效系统 ====================
        let audioContext = null;

        function getAudioContext() {
            if (!audioContext) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return null;
                audioContext = new AudioContextClass();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            return audioContext;
        }

        function playTone(frequency, duration, type = 'sine', volume = 0.3) {
            const ctx = getAudioContext();
            if (!ctx) return;
            const oscillator = ctx.createOscillator();
            const gainNode = ctx.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, ctx.currentTime);
            gainNode.gain.setValueAtTime(volume, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);
            oscillator.start(ctx.currentTime);
            oscillator.stop(ctx.currentTime + duration);
        }

        function playClickSound() {
            playTone(600, 0.1, 'sine', 0.2);
        }

        function playCorrectSound() {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            const osc1 = ctx.createOscillator();
            const gain1 = ctx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(600, now);
            gain1.gain.setValueAtTime(0.25, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            osc1.connect(gain1);
            gain1.connect(ctx.destination);
            osc1.start(now);
            osc1.stop(now + 0.12);
            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(900, now + 0.12);
            gain2.gain.setValueAtTime(0.25, now + 0.12);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.start(now + 0.12);
            osc2.stop(now + 0.24);
        }

        function playWrongSound() {
            const ctx = getAudioContext();
            if (!ctx) return;
            const now = ctx.currentTime;
            const osc1 = ctx.createOscillator();
            const gain1 = ctx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(400, now);
            gain1.gain.setValueAtTime(0.3, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc1.connect(gain1);
            gain1.connect(ctx.destination);
            osc1.start(now);
            osc1.stop(now + 0.15);
            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(200, now + 0.15);
            gain2.gain.setValueAtTime(0.3, now + 0.15);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.start(now + 0.15);
            osc2.stop(now + 0.3);
        }

        function playNextSound() {
            playTone(500, 0.08, 'sine', 0.25);
        }

        // ==================== HTML 转义（防止 XSS） ====================
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ==================== 认证系统 ====================
        function openAuthModal() {
            authMode = 'login';
            updateAuthUI();
            document.getElementById('auth-error').textContent = '';
            document.getElementById('auth-email').value = '';
            document.getElementById('auth-password').value = '';
            document.getElementById('auth-modal').classList.remove('hidden');
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hidden');
        }

        function switchAuthMode() {
            authMode = authMode === 'login' ? 'register' : 'login';
            updateAuthUI();
            document.getElementById('auth-error').textContent = '';
        }

        function updateAuthUI() {
            document.getElementById('auth-title').textContent = authMode === 'login' ? '登录' : '注册';
            document.getElementById('auth-submit-btn').textContent = authMode === 'login' ? '登录' : '注册';
            document.getElementById('auth-switch-btn').textContent = authMode === 'login' ? '没有账号？去注册' : '已有账号？去登录';
        }

        async function submitAuth() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const errorEl = document.getElementById('auth-error');
            errorEl.textContent = '';

            if (!email || !password) {
                errorEl.textContent = '请输入邮箱和密码。';
                return;
            }
            if (password.length < 6) {
                errorEl.textContent = '密码至少 6 位。';
                return;
            }

            try {
                let result;
                if (authMode === 'register') {
                    result = await db.auth.signUp({ email, password });
                } else {
                    result = await db.auth.signInWithPassword({ email, password });
                }

                if (result.error) {
                    errorEl.textContent = result.error.message;
                    return;
                }

                // 注册时如果开启了邮箱确认，session 可能为 null
                if (authMode === 'register' && !result.data.session) {
                    errorEl.textContent = '注册成功！请到邮箱点击确认链接后再登录。';
                    return;
                }

                closeAuthModal();
                await refreshAuthState();
            } catch (err) {
                errorEl.textContent = '操作失败：' + (err.message || err);
            }
        }

        async function refreshAuthState() {
            const { data: { session } } = await db.auth.getSession();
            currentUser = session ? session.user : null;

            const statusBar = document.getElementById('auth-status-bar');
            if (currentUser) {
                statusBar.innerHTML = `已登录：<span class="user-email">${escapeHtml(currentUser.email)}</span> <button class="btn-secondary" id="auth-toggle-btn" onclick="handleLogout()" style="padding:6px 14px;font-size:0.9rem;">退出登录</button>`;
            } else {
                statusBar.innerHTML = `未登录，历史记录和错题仅保存在本机 <button class="btn-secondary" id="auth-toggle-btn" onclick="openAuthModal()" style="padding:6px 14px;font-size:0.9rem;">👤 登录</button>`;
            }

            // 登录状态变化后，刷新当前屏幕
            if (currentScreen === 'history') renderHistory();
            if (currentScreen === 'mode') showModeScreen(currentCategory);
        }

        async function handleLogout() {
            const confirmed = await showConfirm('确定要退出登录吗？\n退出后本地仍会保留一份数据。', '退出登录');
            if (!confirmed) return;
            await db.auth.signOut();
            currentUser = null;
            await refreshAuthState();
            showAlert('已退出登录。', '提示');
        }

        // ==================== 自定义弹窗 ====================
        function showAlert(message, title = '提示') {
            return showModal(message, title, false);
        }

        function showConfirm(message, title = '确认') {
            return showModal(message, title, true);
        }

        function showModal(message, title, isConfirm) {
            return new Promise(resolve => {
                const overlay = document.getElementById('modal-overlay');
                const titleEl = document.getElementById('modal-title');
                const messageEl = document.getElementById('modal-message');
                const okBtn = document.getElementById('modal-ok');
                const cancelBtn = document.getElementById('modal-cancel');

                // 使用 textContent 防 XSS；\n 由 CSS 的 white-space: pre-line 支持换行
                titleEl.textContent = title;
                messageEl.textContent = message;

                // 显示或隐藏取消按钮
                cancelBtn.classList.toggle('hidden', !isConfirm);

                const cleanup = () => {
                    overlay.classList.add('hidden');
                    okBtn.onclick = null;
                    cancelBtn.onclick = null;
                };

                okBtn.onclick = () => {
                    cleanup();
                    resolve(true);
                };
                cancelBtn.onclick = () => {
                    cleanup();
                    resolve(false);
                };

                overlay.classList.remove('hidden');
            });
        }

        // ==================== 题库归一化（给没有 type 的老题目补上 type） ====================
        function normalizeQuestions(list) {
            return list.map(q => ({
                ...q,
                type: q.type || 'single'   // 缺省按单选题处理
            }));
        }

        // ==================== 填空题答案归一化（忽略空格、标点、大小写） ====================
        function normalizeAnswer(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .toLowerCase()
                .replace(/[\s\u3000]/g, '')   // 去除所有空白（含全角空格）
                .replace(/\p{P}/gu, '');       // 去除所有标点符号（需支持 ES2018，现代浏览器均支持）
        }

        // ==================== 错题本管理 ====================
        function questionKey(q) {
            return (q.question || '').trim();
        }

        // ==================== 错题本管理（支持云端） ====================
        async function getWrongListAsync(category) {
            if (currentUser) {
                try {
                    const { data, error } = await db
                        .from('quiz_wrong_questions')
                        .select('question_data')
                        .eq('category', category);
                    if (!error && data) {
                        return data.map(row => row.question_data);
                    }
                } catch (err) {
                    console.warn('云端读取错题失败：', err);
                }
            }
            const all = JSON.parse(localStorage.getItem(WRONG_QUESTIONS_KEY) || '{}');
            return Array.isArray(all[category]) ? all[category] : [];
        }

        // 保留同步版本用于本地场景
        function getWrongList(category) {
            const all = JSON.parse(localStorage.getItem(WRONG_QUESTIONS_KEY) || '{}');
            return Array.isArray(all[category]) ? all[category] : [];
        }

        function saveWrongList(category, list) {
            const all = JSON.parse(localStorage.getItem(WRONG_QUESTIONS_KEY) || '{}');
            if (list.length === 0) {
                delete all[category];
            } else {
                all[category] = list;
            }
            localStorage.setItem(WRONG_QUESTIONS_KEY, JSON.stringify(all));
        }

        async function addToWrongList(question) {
            const category = question.category || '未分类';
            const data = {
                type: question.type || 'single',
                question: question.question,
                options: question.options,
                answer: question.answer,
                explanation: question.explanation,
                category: category
            };

            // 本地保存
            const all = JSON.parse(localStorage.getItem(WRONG_QUESTIONS_KEY) || '{}');
            const list = Array.isArray(all[category]) ? all[category] : [];
            if (!list.some(q => questionKey(q) === questionKey(question))) {
                list.push(data);
                all[category] = list;
                localStorage.setItem(WRONG_QUESTIONS_KEY, JSON.stringify(all));
            }

            // 云端同步，先查再插
            if (currentUser) {
                const { data: existing, error: queryErr } = await db
                    .from('quiz_wrong_questions')
                    .select('id')
                    .eq('user_id', currentUser.id)
                    .eq('category', category)
                    .eq('question_data->>question', question.question)
                    .limit(1);

                if (queryErr) {
                    console.warn('查询云端错题失败：', queryErr);
                } else if (!existing || existing.length === 0) {
                    const { error: insertErr } = await db.from('quiz_wrong_questions').insert({
                        user_id: currentUser.id,
                        category: category,
                        question_data: data
                    });
                    if (insertErr) {
                        console.warn('云端保存错题失败：', insertErr);
                    }
                }
            }
        }

        async function removeFromWrongList(question) {
            const category = question.category || '未分类';
            const key = questionKey(question);

            // 本地移除
            const all = JSON.parse(localStorage.getItem(WRONG_QUESTIONS_KEY) || '{}');
            const list = Array.isArray(all[category]) ? all[category] : [];
            const newList = list.filter(q => questionKey(q) !== key);
            if (newList.length === 0) delete all[category];
            else all[category] = newList;
            localStorage.setItem(WRONG_QUESTIONS_KEY, JSON.stringify(all));

            // 云端移除
            if (currentUser) {
                const { error } = await db.from('quiz_wrong_questions')
                    .delete()
                    .eq('user_id', currentUser.id)
                    .eq('category', category)
                    .eq('question_data->>question', key);
                if (error) {
                    console.warn('云端删除错题失败：', error);
                }
            }
        }

        // ==================== 题库加载 ====================
        function loadQuestions() {
            const saved = localStorage.getItem(CUSTOM_QUESTIONS_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        questions = normalizeQuestions(parsed);
                    } else {
                        questions = [];
                    }
                } catch (e) {
                    questions = [];
                }
            } else {
                questions = [];
            }
            if (currentIndex >= questions.length) {
                currentIndex = 0;
                score = 0;
            }
        }

        // ==================== 导入题库 ====================
        function importQuestions(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    // 去掉可能存在的 BOM 头，再解析
                    const rawText = e.target.result.replace(/^\uFEFF/, '').trim();
                    const imported = JSON.parse(rawText);
                    //const imported = JSON.parse(e.target.result);
                    if (!Array.isArray(imported)) {
                        showAlert('导入失败：文件内容不是数组格式。', '导入失败');
                        return;
                    }
                    //新的校验逻辑
                    for (let q of imported) {
                        const type = q.type || 'single';
                        if (!q.question) {
                            showAlert('导入失败：缺少 question 字段。', '导入失败');
                            return;
                        }
                        if (type === 'single' || type === 'judge') {
                            if (!Array.isArray(q.options) || typeof q.answer !== 'number') {
                                showAlert(`导入失败：${type} 题型缺少 options 或 answer。`, '导入失败');
                                return;
                            }
                            if (q.answer < 0 || q.answer >= q.options.length) {
                                showAlert(`导入失败：answer 超出选项范围（题目：${q.question}）。`, '导入失败');
                                return;
                            }
                        } else if (type === 'fill') {
                            const ansArr = Array.isArray(q.answer) ? q.answer : [q.answer];
                            if (ansArr.length === 0) {
                                showAlert('导入失败：填空题缺少有效 answer。', '导入失败');
                                return;
                            }
                        } else {
                            showAlert(`导入失败：未知题型 "${type}"。`, '导入失败');
                            return;
                        }
                    }

                    // 1. 彻底停止定时器
                    if (timerInterval) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                    }

                    // 2. 清除旧的答题进度
                    localStorage.removeItem(STORAGE_KEY);

                    // 3. 更新题库
                    questions = normalizeQuestions(imported);   // ← 加了一层 normalizeQuestions
                    localStorage.setItem(CUSTOM_QUESTIONS_KEY, JSON.stringify(questions));

                    // 4. 重置所有答题状态，避免残留数据
                    currentIndex = 0;
                    score = 0;
                    answeredCount = 0;
                    answered = false;
                    selectedOption = null;
                    quizQuestions = [];
                    timeLeft = 0;

                    // 5. 返回科目选择界面
                    showCategoryScreen();
                    showAlert(`成功导入 ${questions.length} 道题目！`, '导入成功');
                } catch (err) {
                    showAlert('导入失败：无法解析 JSON 文件。\n错误信息：' + (err && err.message ? err.message : err), '导入失败');
                    //showAlert('导入失败：无法解析 JSON 文件，请检查格式。', '导入失败');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ==================== 初始化 ====================
        async function init() {
            loadQuestions();

            // 初始化认证状态
            await refreshAuthState();

            // 监听认证变化
            db.auth.onAuthStateChange((event, session) => {
                currentUser = session ? session.user : null;
                if (event === 'SIGNED_IN' || event === 'SIGNED_OUT') {
                    refreshAuthState();
                }
            });

            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.quizQuestions && data.quizQuestions.length > 0) {
                        currentCategory = data.category;
                        currentMode = data.mode;
                        quizQuestions = data.quizQuestions;
                        currentIndex = data.currentIndex || 0;
                        score = data.score || 0;
                        answeredCount = data.answeredCount || 0;
                        answered = data.answered || false;
                        selectedOption = data.selectedOption !== undefined ? data.selectedOption : null;
                        fillAnswer = data.fillAnswer || '';
                        timeLeft = data.timeLeft || 0;
                        isReviewMode = data.isReviewMode || false;
                        showQuizScreen();
                        if (timeLeft > 0) startTimer();
                        renderQuestion();
                        updateStats();
                        updateTimerDisplay();
                        return;
                    }
                } catch (e) {}
            }
            showCategoryScreen();
        }

        // ==================== 屏幕切换 ====================
        function showScreen(screenId) {
            document.getElementById('category-screen').classList.add('hidden');
            document.getElementById('mode-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('history-screen').classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
        }

        function showCategoryScreen() {
            showScreen('category-screen');
            currentScreen = 'category';
            renderCategoryButtons();
        }

        function showHistoryScreen() {
            showScreen('history-screen');
            currentScreen = 'history';
            renderHistory();
        }

        //从云端读取
        async function renderHistory() {
            const container = document.getElementById('history-list');
            let history = [];

            // 优先从云端读取（如果已登录）
            if (currentUser) {
                try {
                    const { data, error } = await db
                        .from('quiz_history')
                        .select('*')
                        .order('created_at', { ascending: false })
                        .limit(200);
                    if (!error && data && data.length > 0) {
                        history = data.map(item => ({
                            date: item.date,
                            time: item.time,
                            category: item.category,
                            mode: item.mode,
                            score: item.score,
                            total: item.total,
                            timestamp: new Date(item.created_at).getTime()
                        }));
                    }
                } catch (err) {
                    console.warn('云端读取历史记录失败，使用本地数据：', err);
                }
            }

            // 云端无数据或未登录时，回退到本地
            if (history.length === 0) {
                history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            }

            if (history.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#888;">暂无历史记录</p>';
                return;
            }

            // 按日期分组
            const groups = {};
            history.forEach(item => {
                if (!groups[item.date]) groups[item.date] = [];
                groups[item.date].push(item);
            });
            const sortedDates = Object.keys(groups).sort((a, b) => b.localeCompare(a));
            let html = '';
            sortedDates.forEach(date => {
                let totalAnswered = 0;
                let totalCorrect = 0;
                groups[date].forEach(item => {
                    totalAnswered += item.total;
                    totalCorrect += item.score;
                });
                const totalWrong = totalAnswered - totalCorrect;
                const accuracy = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0;

                html += `<div class="history-date-group">`;
                html += `<h3>${escapeHtml(date)}
                    <span class="daily-summary">今日共答${totalAnswered}题，答对${totalCorrect}题，答错${totalWrong}题，正确率${accuracy}%</span>
                </h3>`;
                groups[date].forEach(item => {
                    html += `<div class="history-item">
                        <span>📚 ${escapeHtml(item.category)} | 🎯 ${escapeHtml(item.mode)} | ⏰ ${escapeHtml(item.time)}</span>
                        <span class="score">✅ ${item.score}/${item.total}</span>
                    </div>`;
                });
                html += `</div>`;
            });
            container.innerHTML = html;
        }

        async function showModeScreen(category) {

            showScreen('mode-screen');

        function showQuizScreen() {

        }

        async function showMainMenu() {
            // 如果正在答题，先询问用户确认
            if (currentScreen === 'quiz' && quizQuestions.length > 0) {
                const confirmExit = await showConfirm(
                    '确定要退出答题吗？\n当前答题进度将被清除，本次作答不会记入历史记录。',
                    '退出确认'
                );
                if (!confirmExit) return;
            }

            // 停止计时器
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            // 清除保存的答题进度
            localStorage.removeItem(STORAGE_KEY);

            // 重置答题相关状态，避免残留数据影响下次
            quizQuestions = [];
            currentIndex = 0;
            score = 0;
            answeredCount = 0;

            selectedOption = null;   // 顺手补上（之前遗漏）

        // ==================== 科目按钮 ====================
        function renderCategoryButtons() {
            const container = document.getElementById('category-buttons');
            container.innerHTML = '';
            
            // 无题库时给出提示
            if (questions.length === 0) {
                const tip = document.createElement('p');
                tip.style.textAlign = 'center';
                tip.style.color = '#888';
                tip.style.padding = '20px 0';
                tip.textContent = '暂无题库，请点击下方「📂 导入题库」按钮导入。';
                container.appendChild(tip);
                return;
            }
            
            // 从题库中提取所有科目
            const categoriesInQuestions = [...new Set(questions.map(q => q.category || '未分类'))];
            categoriesInQuestions.forEach(cat => {
                const btn = document.createElement('button');
                btn.textContent = cat;
                btn.onclick = () => {
                    const hasQuestions = questions.some(q => (q.category || '未分类') === cat);
                    if (!hasQuestions) {
                        showAlert(`“${cat}”科目暂无题目，请先导入题库。`, '提示');
                        return;
                    }
                    playClickSound();
                    showModeScreen(cat);
                };
                container.appendChild(btn);
            });
        }

        // ==================== 开始答题 ====================
        function startQuiz(count, seconds) {
            playClickSound(); // 添加这一行增加提示音
            const categoryQuestions = questions.filter(q => (q.category || '未分类') === currentCategory);
            if (categoryQuestions.length === 0) {
                showAlert('该科目暂无题目，请先导入。', '提示');
                return;
            }
            const shuffled = shuffleArray([...categoryQuestions]);
            quizQuestions = shuffled.slice(0, Math.min(count, shuffled.length));
            if (quizQuestions.length < count) {
                showAlert(`注意：该科目仅有 ${categoryQuestions.length} 道题，将全部使用。`, '提示');
            }
            currentIndex = 0;
            score = 0;
            answeredCount = 0;   // 新增：重置已作答题数
            answered = false;         // 新增
            selectedOption = null;    // 新增
            fillAnswer = '';            // 新增
            timeLeft = seconds;
            currentMode = { count, seconds };
            isReviewMode = false;   // 新增：普通模式
            showQuizScreen();
            renderQuestion();
            updateStats();
            updateTimerDisplay();
            startTimer();
            saveProgress();
        }

        // ==================== 错题回顾 ====================
        async function startReviewQuiz() {
            playClickSound();
            const wrongList = await getWrongListAsync(currentCategory);
            if (wrongList.length === 0) {
                showAlert(`“${currentCategory}”暂无错题记录，请先在练习中积累错题。`, '提示');
                return;
            }
            
            // 归一化错题（确保每道题都有 type 字段）
            const pool = normalizeQuestions([...wrongList]);
            const shuffled = shuffleArray(pool);
            quizQuestions = shuffled.slice(0, Math.min(30, shuffled.length));
            
            currentIndex = 0;
            score = 0;
            answeredCount = 0;
            answered = false;
            selectedOption = null;
            fillAnswer = '';
            timeLeft = 600;   // 10 分钟
            currentMode = { count: 30, seconds: 600 };
            isReviewMode = true;   // 关键：标记为错题回顾
            
            showQuizScreen();
            renderQuestion();
            updateStats();
            updateTimerDisplay();
            startTimer();
            saveProgress();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(async () => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    timeLeft = 0;
                    if (!answered) {
                        submitAnswer(true);
                    }
                    await showAlert('时间到！自动交卷。', '时间到');
                    finishQuiz();
                    return;
                }
                saveProgress();
            }, 1000);
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ==================== 进度保存 ====================
        function saveProgress() {
            if (currentScreen === 'quiz') {
                const data = {
                    category: currentCategory,
                    mode: currentMode,
                    quizQuestions: quizQuestions,
                    currentIndex: currentIndex,
                    score: score,
                    answeredCount: answeredCount,   // 新增
                    answered: answered,                 // 新增
                    selectedOption: selectedOption,     // 新增
                    fillAnswer: fillAnswer,              // 新增
                    timeLeft: timeLeft,
                    isReviewMode: isReviewMode   // 新增
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } else {
                localStorage.removeItem(STORAGE_KEY);
            }
        }

        // ==================== 渲染题目 ====================
        function renderQuestion() {
            const question = quizQuestions[currentIndex];
            document.getElementById('question-text').textContent = question.question;
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            document.getElementById('result-message').textContent = '';
            const explanationBox = document.getElementById('explanation-box');
            explanationBox.classList.add('hidden');
            explanationBox.innerHTML = '';

            const type = question.type || 'single';

            // 渲染题目区域
            if (type === 'fill') {
                renderFillInput(question);
                const input = document.getElementById('fill-input');
                if (input) {
                    input.value = fillAnswer || '';
                    if (answered) input.disabled = true;
                }
            } else {
                renderOptions(question, type);
                if (selectedOption !== null && !answered) {
                    const options = document.querySelectorAll('.option');
                    if (options[selectedOption]) options[selectedOption].classList.add('selected');
                }
            }

            // 按钮状态
            if (answered) {
                renderAnsweredState(question);
            } else {
                document.getElementById('btn-submit').classList.remove('hidden');
                document.getElementById('btn-next').classList.add('hidden');
            }

            updateStats();
            updateTimerDisplay();
        }

        // 渲染选项（单选/判断题共用）
        function renderOptions(question, type) {
            const optionsContainer = document.getElementById('options-container');
            question.options.forEach((opt, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                let prefix;
                if (type === 'judge') {
                    prefix = index === 0 ? '✔' : '✘';
                } else {
                    prefix = String.fromCharCode(65 + index);
                }
                optionDiv.textContent = `${prefix}. ${opt}`;
                optionDiv.dataset.index = index;
                optionDiv.addEventListener('click', () => selectOption(index));
                optionsContainer.appendChild(optionDiv);
            });
        }

        // 渲染填空输入框
        function renderFillInput(question) {
            const optionsContainer = document.getElementById('options-container');
            const wrapper = document.createElement('div');
            wrapper.className = 'fill-container';

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'fill-input';
            input.id = 'fill-input';
            input.placeholder = '请输入你的答案';
            input.autocomplete = 'off';
            input.value = fillAnswer || '';
            input.oninput = (e) => { fillAnswer = e.target.value; };

            wrapper.appendChild(input);
            optionsContainer.appendChild(wrapper);
        }

        // 新增函数：渲染已提交状态
        function renderAnsweredState(question) {
            const type = question.type || 'single';
            if (type === 'fill') {
                renderFillAnsweredState(question);
            } else {
                renderOptionsAnsweredState(question);
            }
            document.getElementById('btn-submit').classList.add('hidden');
            document.getElementById('btn-next').classList.remove('hidden');
        }

        // 选项题（单选/判断）已提交状态
        function renderOptionsAnsweredState(question) {
            const isCorrect = selectedOption === question.answer;
            const options = document.querySelectorAll('.option');

            options.forEach((opt, idx) => {
                if (idx === question.answer) {
                    opt.classList.add('correct');
                } else if (idx === selectedOption && !isCorrect) {
                    opt.classList.add('wrong');
                }
                opt.style.pointerEvents = 'none';
            });

            if (isCorrect) {
                document.getElementById('result-message').textContent = '✅ 回答正确！';
                document.getElementById('result-message').style.color = '#28a745';
            } else {
                document.getElementById('result-message').textContent = `❌ 回答错误，正确答案是 ${String.fromCharCode(65 + question.answer)}`;
                document.getElementById('result-message').style.color = '#dc3545';
                const explanationBox = document.getElementById('explanation-box');
                explanationBox.classList.remove('hidden');
                const correctLetter = String.fromCharCode(65 + question.answer);
                const correctOptionText = question.options[question.answer];
                const explanationText = question.explanation || '暂无解析';
                const safeExplanation = escapeHtml(explanationText).replace(/\n/g, '<br>');
                explanationBox.innerHTML = `
                    <div class="correct-answer">✅ 正确答案：${escapeHtml(correctLetter)}. ${escapeHtml(correctOptionText)}</div>
                    <div>📖 解析：${safeExplanation}</div>
                `;
            }
        }

        // 填空题已提交状态
        function renderFillAnsweredState(question) {
            const input = document.getElementById('fill-input');
            if (input) input.disabled = true;

            const userAnswer = fillAnswer || '';
            const correctAnswers = Array.isArray(question.answer) ? question.answer : [question.answer];
            const userNorm = normalizeAnswer(userAnswer);
            const isCorrect = userNorm !== '' && correctAnswers.some(ans => normalizeAnswer(ans) === userNorm);

            if (isCorrect) {
                if (input) input.classList.add('correct');
                document.getElementById('result-message').textContent = '✅ 回答正确！';
                document.getElementById('result-message').style.color = '#28a745';
            } else {
                if (input) input.classList.add('wrong');
                document.getElementById('result-message').textContent = '❌ 回答错误';
                document.getElementById('result-message').style.color = '#dc3545';

                const explanationBox = document.getElementById('explanation-box');
                explanationBox.classList.remove('hidden');

                const correctAnswerText = correctAnswers.join(' / ');
                const userDisplay = (userAnswer && userAnswer.trim() !== '') ? escapeHtml(userAnswer) : '（未作答）';
                const explanationText = question.explanation || '暂无解析';
                const safeExplanation = escapeHtml(explanationText).replace(/\n/g, '<br>');

                explanationBox.innerHTML = `
                    <div class="correct-answer">✅ 正确答案：${escapeHtml(correctAnswerText)}</div>
                    <div>📝 你的答案：${userDisplay}</div>
                    <div>📖 解析：${safeExplanation}</div>
                `;
            }
        }

        // ==================== 选择选项 ====================
        function selectOption(index) {
            if (answered) return;
            playClickSound();
            document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
            const options = document.querySelectorAll('.option');
            options[index].classList.add('selected');
            selectedOption = index;
        }

        // ==================== 提交答案 ====================
        async function submitAnswer(force = false) {
            if (answered) return;

            const question = quizQuestions[currentIndex];
            const type = question.type || 'single';
            let isCorrect = false;

            if (type === 'fill') {
                if (!force && (!fillAnswer || fillAnswer.trim() === '')) {
                    showAlert('请先输入答案！', '提示');
                    return;
                }
                answered = true;
                if (fillAnswer && fillAnswer.trim() !== '') {
                    answeredCount++;
                }
                const userNorm = normalizeAnswer(fillAnswer);
                const correctAnswers = Array.isArray(question.answer) ? question.answer : [question.answer];
                isCorrect = userNorm !== '' && correctAnswers.some(ans => normalizeAnswer(ans) === userNorm);
            } else {
                if (selectedOption === null && !force) {
                    showAlert('请先选择一个答案！', '提示');
                    return;
                }
                answered = true;
                isCorrect = force && selectedOption === null ? false : selectedOption === question.answer;
                if (selectedOption !== null) {
                    answeredCount++;
                }
            }

            if (isCorrect) {
                score++;
                playCorrectSound();
            } else {
                playWrongSound();
            }

            // 1. 先立即渲染 UI 反馈，用户无需等待网络
            renderAnsweredState(question);
            saveProgress();
            updateStats();

            // 2. 后台异步同步错题（不 await，不阻塞界面）
            if (isCorrect) {
                if (isReviewMode) {
                    removeFromWrongList(question);   // fire and forget
                }
            } else {
                if (!isReviewMode) {
                    addToWrongList(question);        // fire and forget
                }
            }
        }

        // ==================== 下一题 ====================
        function nextQuestion() {
            playNextSound();
            currentIndex++;
            if (currentIndex >= quizQuestions.length) {
                finishQuiz();
                return;
            }
            answered = false;         // 新增：进入新题时重置
            selectedOption = null;    // 新增
            fillAnswer = '';        // 新增
            saveProgress();
            renderQuestion();
        }

        // ==================== 结束答题 ====================
        async function finishQuiz() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
            const total = answeredCount;
            const percentage = total > 0 ? Math.round((score / total) * 100) : 0;
            
            const title = isReviewMode ? '错题回顾结束' : '答题结束';
            await showAlert(
                `🎉 ${title}！\n作答：${total} 题，答对：${score} 题，正确率：${percentage}%`,
                title
            );
            
            const modeText = isReviewMode 
                ? '错题回顾' 
                : `${Math.round(currentMode.seconds / 60)}分钟${currentMode.count}题`;

            // 先切屏，让用户立即回到主页
            localStorage.removeItem(STORAGE_KEY);
            isReviewMode = false;
            showCategoryScreen();

            // 后台异步保存历史记录，不阻塞界面
            saveHistoryRecord(currentCategory, modeText, score, total);
        }

        // ==================== 保存历史记录 ====================
        async function saveHistoryRecord(category, mode, score, total) {
            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            const record = { date: dateStr, time: timeStr, category, mode, score, total };

            // 1. 保存到本地（离线备份）
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
            history.push({ ...record, timestamp: now.getTime() });
            history.sort((a, b) => b.timestamp - a.timestamp);
            if (history.length > 200) history.length = 200;
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));

            // 2. 已登录则同步云端
            if (currentUser) {
                const { error } = await db.from('quiz_history').insert({
                    user_id: currentUser.id,
                    ...record
                });
                if (error) {
                    console.warn('云端保存历史记录失败：', error);
                }
            }
        }

        // ==================== 更新统计 ====================
        function updateStats() {
            document.getElementById('current-question').textContent = currentIndex + 1;
            document.getElementById('total-questions').textContent = quizQuestions.length;
            document.getElementById('score').textContent = score;
            // 使用已作答题数计算进度，未作答时为 0%，全部作答完为 100%
            const progress = quizQuestions.length > 0 
                ? (answeredCount / quizQuestions.length) * 100 
                : 0;
            document.getElementById('progress-fill').style.width = progress + '%';
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('time-left').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // ==================== 启动应用 ====================
        window.onload = init;
    </script>
</body>
</html>
